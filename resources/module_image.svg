<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="cuzyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E23FA6"/>
            <stop offset="100%" stop-color="#7B2FF7"/>
        </linearGradient>
        <!-- White = icon, black = cut-out showing the background -->
        <mask id="iconMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <!-- Envelope -->
            <rect x="12" y="20" width="54" height="40" rx="5" fill="#fff"/>
            <polyline points="15,24 39,43 63,24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Gap around the log list -->
            <rect x="40" y="40" width="52" height="46" rx="8" fill="#000"/>
            <!-- Log list -->
            <rect x="45" y="45" width="42" height="36" rx="5" fill="#fff"/>
            <circle cx="53" cy="54" r="2.6" fill="#000"/>
            <rect x="59" y="52" width="21" height="4" rx="2" fill="#000"/>
            <circle cx="53" cy="63" r="2.6" fill="#000"/>
            <rect x="59" y="61" width="21" height="4" rx="2" fill="#000"/>
            <circle cx="53" cy="72" r="2.6" fill="#000"/>
            <rect x="59" y="70" width="14" height="4" rx="2" fill="#000"/>
        </mask>
    </defs>
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#cuzyGrad)"/>
    <rect x="0" y="0" width="100" height="100" fill="#fff" mask="url(#iconMask)"/>
</svg>
